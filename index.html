<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moxie Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            spotify: {
              bg: '#121212',
              black: '#000000',
              green: '#1DB954',
              greenHover: '#1ed760',
              text: '#FFFFFF',
              subtext: '#B3B3B3',
              surface: '#181818',
              surfaceHover: '#282828',
              border: '#282828'
            }
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      overflow: hidden;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #282828;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }
    
    /* Gradient for main content */
    .main-gradient {
      background: linear-gradient(180deg, #1a1a2e 0%, #121212 30%);
    }
    
    /* Progress slider styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    
    /* Progress bar background */
    .progress-bar-bg {
      background-color: #4d4d4d;
      border-radius: 2px;
    }
    
    /* Progress fill - turns green when playing */
    .progress-fill {
      background-color: #ffffff;
      border-radius: 2px;
      transition: background-color 0.2s ease;
    }
    
    .progress-fill.playing {
      background-color: #1DB954;
    }
    
    /* Progress thumb */
    .progress-thumb {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    
    .progress-thumb:hover {
      transform: scale(1.2);
    }
    
    /* Play button hover effect */
    .play-btn:hover {
      transform: scale(1.05);
      background-color: #1ed760;
    }
    
    /* Playlist item hover */
    .playlist-item:hover {
      background-color: #1a1a1a;
    }
    
    /* Song row hover */
    .song-row {
      transition: background-color 0.2s ease;
    }
    .song-row:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .song-row:hover .song-index {
      opacity: 0;
    }
    .song-row:hover .play-icon-small {
      opacity: 1;
    }
    .song-row .play-icon-small {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .song-row .song-index {
      transition: opacity 0.2s ease;
    }
    
    /* Drop zone active */
    .drop-zone-active {
      background-color: rgba(29, 185, 84, 0.1) !important;
      border: 2px dashed #1DB954 !important;
      border-radius: 8px;
    }
  </style>
</head>
<body class="h-screen flex flex-col">
  <!-- Main Content Area -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar - Your Library -->
    <div class="w-[240px] bg-spotify-black flex flex-col border-r border-spotify-border">
      <!-- Logo -->
      <div class="p-4">
        <h1 class="text-white font-bold text-lg">Moxie Player</h1>
      </div>
      
      <!-- Search Bar -->
      <div class="px-4 mb-4">
        <div class="bg-spotify-surfaceHover rounded-lg flex items-center px-3 py-2 cursor-pointer hover:bg-[#333] transition-colors">
          <svg class="w-4 h-4 text-spotify-subtext mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <span class="text-spotify-subtext text-sm">Search</span>
        </div>
      </div>
      
      <!-- Your Library Section -->
      <div class="px-4 mb-2">
        <h2 class="text-spotify-subtext text-xs font-bold uppercase tracking-wider">Your Library</h2>
      </div>
      
      <!-- Playlist List -->
      <div id="playlist-list" class="flex-1 overflow-y-auto px-2">
        <!-- Playlists will be dynamically inserted here -->
      </div>
      
      <!-- Create Playlist Button -->
      <div class="p-4 border-t border-spotify-border">
        <button id="create-playlist-btn" class="w-full text-left text-spotify-subtext hover:text-white transition-colors flex items-center py-2 text-sm">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Create Playlist
        </button>
      </div>
    </div>
    
    <!-- Main Content Panel -->
    <div id="main-content" class="flex-1 main-gradient overflow-y-auto relative">
      <!-- Home View - Playlist Grid -->
      <div id="home-view" class="p-6">
        <h1 class="text-white font-bold text-3xl mb-6">Your Playlists</h1>
        <div id="playlist-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
          <!-- Playlist cards will be inserted here -->
        </div>
        <div id="no-playlists" class="text-center py-20 hidden">
          <p class="text-spotify-subtext text-lg">No playlists yet</p>
          <p class="text-spotify-subtext text-sm mt-2">Click "+ Create Playlist" to get started</p>
        </div>
      </div>
      
      <!-- Playlist View - Songs -->
      <div id="playlist-view" class="hidden">
        <!-- Playlist Header -->
        <div id="playlist-header" class="sticky top-0 bg-gradient-to-b from-[#1a1a2e] to-spotify-bg z-10 p-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <button id="back-btn" class="text-spotify-subtext hover:text-white transition-colors p-2 rounded-lg hover:bg-spotify-surfaceHover">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
              </button>
              <h1 id="playlist-title" class="text-white font-bold text-3xl">Select a Playlist</h1>
            </div>
            <button id="edit-playlist-btn" class="text-spotify-subtext hover:text-white transition-colors p-2 rounded-lg hover:bg-spotify-surfaceHover">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
              </svg>
            </button>
          </div>
        </div>
        
        <!-- Song List -->
        <div id="song-list" class="p-6">
          <div id="empty-state" class="text-center py-20">
            <p class="text-spotify-subtext text-lg">This playlist is empty</p>
            <p class="text-spotify-subtext text-sm mt-2">Drag and drop MP3 files here to add songs</p>
          </div>
          
          <!-- Songs will be dynamically inserted here -->
          <div id="songs-container" class="hidden">
            <!-- Header Row -->
            <div class="grid grid-cols-[50px_1fr_80px] gap-4 px-4 py-2 text-spotify-subtext text-xs uppercase tracking-wider border-b border-spotify-border">
              <span>#</span>
              <span>Title</span>
              <span class="text-right"><svg class="w-4 h-4 inline" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></span>
            </div>
            
            <!-- Song Rows -->
            <div id="song-rows" class="mt-2">
              <!-- Song rows will be inserted here -->
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Right Sidebar - Now Playing -->
    <div class="w-[320px] bg-spotify-bg flex flex-col border-l border-spotify-border p-6">
      <div class="flex-1 flex flex-col items-center justify-center">
        <!-- Album Art Placeholder -->
        <div class="w-72 h-72 bg-spotify-surfaceHover rounded-lg flex items-center justify-center mb-6">
          <span class="text-6xl">🎵</span>
        </div>
        
        <!-- Song Info -->
        <h2 id="now-playing-title" class="text-white font-bold text-xl text-center mb-2">Not Playing</h2>
        <p id="now-playing-artist" class="text-spotify-subtext text-center"></p>
      </div>
    </div>
  </div>
  
  <!-- Create Playlist Modal -->
  <div id="create-playlist-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
    <div class="bg-spotify-surface rounded-lg p-6 w-96">
      <h2 class="text-white font-bold text-xl mb-4">Create Playlist</h2>
      <input type="text" id="playlist-name-input" class="w-full bg-spotify-bg text-white border border-spotify-border rounded-lg px-4 py-2 mb-4 focus:outline-none focus:border-spotify-green" placeholder="Playlist name">
      <div class="flex justify-end gap-2">
        <button id="cancel-create-btn" class="px-4 py-2 text-spotify-subtext hover:text-white transition-colors">Cancel</button>
        <button id="confirm-create-btn" class="px-4 py-2 bg-spotify-green text-black rounded-lg font-bold hover:bg-spotify-greenHover transition-colors">Create</button>
      </div>
    </div>
  </div>
  
  <!-- Bottom Player Bar -->
  <div class="h-[90px] bg-spotify-black border-t border-spotify-border flex items-center px-4">
    <!-- Left: Song Details -->
    <div class="w-1/4 flex items-center">
      <div class="w-14 h-14 bg-spotify-surfaceHover rounded-lg flex items-center justify-center mr-4">
        <span class="text-2xl">🎵</span>
      </div>
      <div>
        <p id="player-song-title" class="text-white font-bold text-sm">Not Playing</p>
        <p id="player-artist" class="text-spotify-subtext text-xs"></p>
      </div>
    </div>
    
    <!-- Center: Playback Controls -->
    <div class="flex-1 flex flex-col items-center">
      <!-- Control Buttons -->
      <div class="flex items-center gap-4 mb-2">
        <button id="shuffle-btn" class="text-spotify-subtext hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>
        
        <button id="prev-btn" class="text-spotify-subtext hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        
        <button id="play-btn" class="play-btn w-10 h-10 bg-white rounded-full flex items-center justify-center transition-transform">
          <svg id="play-icon" class="w-5 h-5 text-black ml-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pause-icon" class="w-5 h-5 text-black hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
        
        <button id="next-btn" class="text-spotify-subtext hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
        
        <button id="repeat-btn" class="text-spotify-subtext hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
        </button>
      </div>
      
      <!-- Progress Bar -->
      <div class="flex items-center gap-3 w-full max-w-xl">
        <span id="current-time" class="text-spotify-subtext text-xs w-10 text-right">0:00</span>
        <div class="flex-1 relative h-1 group">
          <div class="progress-bar-bg absolute top-0 left-0 w-full h-full rounded-full"></div>
          <div id="progress-fill" class="progress-fill absolute top-0 left-0 h-full rounded-full transition-all duration-100" style="width: 0%"></div>
          <input type="range" id="progress-slider" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer" min="0" max="100" value="0">
          <div id="progress-thumb" class="progress-thumb absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full opacity-0 group-hover:opacity-100 pointer-events-none" style="left: 0%"></div>
        </div>
        <span id="total-time" class="text-spotify-subtext text-xs w-10">0:00</span>
      </div>
    </div>
    
    <!-- Right: Volume -->
    <div class="w-1/4 flex items-center justify-end gap-2">
      <svg class="w-5 h-5 text-spotify-subtext" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <input type="range" id="volume-slider" class="w-24" min="0" max="100" value="70">
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
